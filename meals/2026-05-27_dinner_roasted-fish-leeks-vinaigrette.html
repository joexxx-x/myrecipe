<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Roasted Fish & Leeks Vinaigrette — Cook Mode</title>
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: #0f0f0f;
    color: #e8e8e8;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header / Recipe Title ── */
  .header {
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    margin-right: 12px;
  }
  .header .meta {
    font-size: 0.8rem;
    color: #888;
    white-space: nowrap;
    display: flex;
    gap: 12px;
  }
  .header .meta span { display: inline-flex; align-items: center; gap: 4px; }

  /* ── Timer Bar ── */
  .timer-bar {
    background: #141414;
    border-bottom: 1px solid #2a2a2a;
    padding: 10px 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    position: sticky;
    top: 53px;
    z-index: 99;
  }
  .timer-bar::-webkit-scrollbar { display: none; }

  .timer-chip {
    flex-shrink: 0;
    background: #222;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    user-select: none;
    -webkit-user-select: none;
  }
  .timer-chip:hover { border-color: #555; }
  .timer-chip.running { border-color: #4CAF50; background: #1a2e1a; }
  .timer-chip.done { border-color: #FF9800; background: #2e2410; animation: pulse 1s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .timer-chip .timer-label {
    font-size: 0.75rem;
    color: #aaa;
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .timer-chip .timer-display {
    font-size: 1.1rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #fff;
    min-width: 52px;
    text-align: center;
  }
  .timer-chip.running .timer-display { color: #6fdf6f; }
  .timer-chip.done .timer-display { color: #FF9800; }

  .timer-chip .timer-actions {
    display: flex;
    gap: 4px;
  }
  .timer-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: #333;
    color: #ccc;
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .timer-btn:hover { background: #444; }
  .timer-btn:active { background: #555; }

  .add-timer-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px dashed #444;
    background: transparent;
    color: #666;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .add-timer-btn:hover { border-color: #888; color: #aaa; }

  /* ── Main Layout ── */
  .main {
    display: flex;
    height: calc(100dvh - 106px);
  }

  /* ── Panels (desktop: side by side) ── */
  .panel {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    -webkit-overflow-scrolling: touch;
  }
  .panel-steps {
    border-right: 1px solid #2a2a2a;
  }

  .panel h2 {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #666;
    margin-bottom: 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid #222;
  }

  /* ── Steps ── */
  .step {
    display: flex;
    gap: 14px;
    margin-bottom: 20px;
    padding: 14px;
    border-radius: 10px;
    background: #171717;
    border: 1px solid #222;
    transition: opacity 0.3s, border-color 0.2s;
    cursor: pointer;
  }
  .step:hover { border-color: #333; }
  .step.done-step { opacity: 0.4; }
  .step.done-step .step-num { background: #2a4a2a; color: #6fdf6f; }

  .step-num {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #2a2a2a;
    color: #888;
    font-size: 0.8rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s;
  }
  .step-text {
    font-size: 0.95rem;
    line-height: 1.6;
    color: #ccc;
    flex: 1;
  }
  .step-timer-tag {
    display: inline-block;
    background: #2a2a3a;
    color: #8888ff;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 6px;
    margin-left: 6px;
    cursor: pointer;
    vertical-align: middle;
  }
  .step-timer-tag:hover { background: #3a3a5a; }

  /* ── Ingredients ── */
  .ingredient-group { margin-bottom: 24px; }
  .ingredient-group h3 {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #555;
    margin-bottom: 10px;
  }
  .ingredient {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 4px;
    cursor: pointer;
    transition: background 0.15s, opacity 0.3s;
    user-select: none;
    -webkit-user-select: none;
  }
  .ingredient:hover { background: #1c1c1c; }
  .ingredient.checked { opacity: 0.35; }
  .ingredient .check-box {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid #444;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-size: 0.7rem;
    color: transparent;
  }
  .ingredient.checked .check-box {
    background: #2a4a2a;
    border-color: #4CAF50;
    color: #6fdf6f;
  }
  .ingredient .ing-amount {
    font-weight: 600;
    color: #fff;
    min-width: 70px;
    font-variant-numeric: tabular-nums;
  }
  .ingredient .ing-name { color: #bbb; }

  /* ── Nutrition footer ── */
  .nutrition-bar {
    display: flex;
    gap: 16px;
    padding: 12px 16px;
    background: #171717;
    border-radius: 10px;
    margin-top: 20px;
    border: 1px solid #222;
  }
  .nutrition-bar .nutr-item {
    text-align: center;
    flex: 1;
  }
  .nutrition-bar .nutr-val {
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
  }
  .nutrition-bar .nutr-label {
    font-size: 0.65rem;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }

  /* ── Timer Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 28px;
    width: min(360px, 90vw);
  }
  .modal h3 { font-size: 1rem; margin-bottom: 20px; color: #fff; }
  .modal label {
    font-size: 0.75rem;
    color: #888;
    display: block;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  .modal input {
    width: 100%;
    background: #222;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 12px;
    color: #fff;
    font-size: 0.95rem;
    outline: none;
  }
  .modal input:focus { border-color: #555; }
  .modal .time-inputs {
    display: flex;
    gap: 8px;
  }
  .modal .time-inputs input { text-align: center; }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }
  .modal-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-cancel { background: #2a2a2a; color: #aaa; }
  .btn-cancel:hover { background: #333; }
  .btn-start { background: #4CAF50; color: #fff; }
  .btn-start:hover { background: #45a049; }

  /* ── Mobile: Tab Switcher ── */
  .tab-bar {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #1a1a1a;
    border-top: 1px solid #2a2a2a;
    z-index: 100;
    padding: 0 0 env(safe-area-inset-bottom, 0);
  }
  .tab-bar-inner {
    display: flex;
  }
  .tab-btn {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #666;
    background: none;
    border: none;
    cursor: pointer;
    border-top: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }
  .tab-btn.active { color: #fff; border-top-color: #4CAF50; }

  /* ── Mobile Layout ── */
  @media (max-width: 768px) {
    .header h1 { font-size: 0.95rem; }
    .header .meta { font-size: 0.7rem; gap: 8px; }

    .main {
      display: block;
      height: auto;
      min-height: calc(100dvh - 106px - 52px);
      padding-bottom: 52px;
    }
    .panel {
      padding: 16px;
      display: none;
    }
    .panel.active { display: block; }
    .panel-steps { border-right: none; }

    .tab-bar { display: block; }

    .timer-bar { top: 49px; padding: 8px 12px; gap: 8px; }

    .step { padding: 12px; }
    .step-text { font-size: 0.9rem; }

    /* Swipe support */
    .swipe-container {
      display: flex;
      width: 200%;
      transition: transform 0.3s ease;
    }
    .swipe-container .panel {
      width: 50%;
      display: block;
      flex-shrink: 0;
    }
    .swipe-container.show-ingredients {
      transform: translateX(-50%);
    }
  }

  @media (min-width: 769px) {
    .panel { display: block !important; }
  }

  /* ── Wake Lock indicator ── */
  .wake-lock-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #444;
    flex-shrink: 0;
    margin-left: 4px;
    transition: background 0.3s;
  }
  .wake-lock-indicator.active { background: #4CAF50; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>Roasted Fish & Leeks Vinaigrette</h1>
  <div class="meta">
    <span>4 servings</span>
    <span>10m prep</span>
    <span>35m cook</span>
    <div class="wake-lock-indicator" id="wakeLock" title="Screen wake lock"></div>
  </div>
</div>

<!-- Timer Bar -->
<div class="timer-bar" id="timerBar">
  <button class="add-timer-btn" onclick="openTimerModal()" title="Add timer">+</button>
</div>

<!-- Main Content -->
<div class="main" id="mainContent">
  <!-- On mobile, this becomes a swipe container via JS -->

  <!-- Steps Panel -->
  <div class="panel panel-steps active" id="panelSteps">
    <h2>Instructions</h2>
    <div id="stepsList">
      <!-- Steps injected by JS -->
    </div>
  </div>

  <!-- Ingredients Panel -->
  <div class="panel panel-ingredients" id="panelIngredients">
    <h2>Ingredients</h2>
    <div id="ingredientsList">
      <!-- Ingredients injected by JS -->
    </div>
    <div class="nutrition-bar" id="nutritionBar">
      <!-- Nutrition injected by JS -->
    </div>
  </div>
</div>

<!-- Tab Bar (mobile only) -->
<div class="tab-bar" id="tabBar">
  <div class="tab-bar-inner">
    <button class="tab-btn active" data-tab="steps" onclick="switchTab('steps')">Instructions</button>
    <button class="tab-btn" data-tab="ingredients" onclick="switchTab('ingredients')">Ingredients</button>
  </div>
</div>

<!-- Timer Modal -->
<div class="modal-overlay" id="timerModal">
  <div class="modal">
    <h3>Add Timer</h3>
    <label>Label</label>
    <input type="text" id="timerLabelInput" placeholder="e.g. Simmer sauce" autocomplete="off">
    <label>Duration</label>
    <div class="time-inputs">
      <input type="number" id="timerMin" placeholder="min" min="0" max="999" inputmode="numeric">
      <input type="number" id="timerSec" placeholder="sec" min="0" max="59" inputmode="numeric">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeTimerModal()">Cancel</button>
      <button class="btn-start" onclick="addTimerFromModal()">Start</button>
    </div>
  </div>
</div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// RECIPE DATA — This block gets replaced per recipe
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const RECIPE = {
  "name": "Roasted Fish & Leeks Vinaigrette",
  "servings": "4",
  "prep_time": "10",
  "cook_time": "35",
  "steps": [
    {
      "text": "Heat oven to 200C. Start 1kg baby potatoes in salted water and simmer until tender, about 18-20 minutes.",
      "timer": {
        "label": "Potatoes",
        "min": 20,
        "sec": 0
      }
    },
    {
      "text": "Wash the sliced leeks in cold water to remove grit, lift out, drain well and pat dry.",
      "timer": null
    },
    {
      "text": "Spread the leeks on a sheet pan with capers, 3 tbsp olive oil and a good pinch of salt. Roast for 15 minutes, tossing halfway, until tender and starting to crisp.",
      "timer": {
        "label": "Roast leeks",
        "min": 15,
        "sec": 0
      }
    },
    {
      "text": "Pat the fish dry. Move the leeks aside, add the fish to the pan, drizzle with 1 tbsp olive oil, season with salt and pepper, then roast until it flakes easily, 10-12 minutes.",
      "timer": {
        "label": "Roast fish",
        "min": 12,
        "sec": 0
      }
    },
    {
      "text": "Whisk the remaining olive oil with shallot, red wine vinegar, parsley, mustard, salt and black pepper to make the vinaigrette.",
      "timer": null
    },
    {
      "text": "Serve the fish and leeks with the potatoes, spooning vinaigrette over everything while warm. Pack two lunch portions for tomorrow and chill them promptly.",
      "timer": null
    }
  ],
  "ingredients": [
    {
      "category": "Protein",
      "items": [
        {
          "amount": "680g",
          "name": "skinless white fish fillets, cod or halibut"
        }
      ]
    },
    {
      "category": "Produce",
      "items": [
        {
          "amount": "2",
          "name": "medium leeks, white and light green parts sliced"
        },
        {
          "amount": "1kg",
          "name": "baby potatoes"
        },
        {
          "amount": "1 tbsp",
          "name": "shallot, minced"
        },
        {
          "amount": "1 tbsp",
          "name": "fresh parsley, minced"
        }
      ]
    },
    {
      "category": "Pantry",
      "items": [
        {
          "amount": "2 tbsp",
          "name": "capers, drained"
        },
        {
          "amount": "90ml",
          "name": "extra-virgin olive oil"
        },
        {
          "amount": "1 tbsp",
          "name": "red wine vinegar"
        },
        {
          "amount": "1 tsp",
          "name": "whole-grain mustard"
        },
        {
          "amount": "to taste",
          "name": "salt and black pepper"
        }
      ]
    }
  ],
  "nutrition": {
    "calories": 560,
    "protein": 38,
    "carbs": 51,
    "fat": 23
  }
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TIMERS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let timers = [];
let timerIdCounter = 0;

function createTimer(label, totalSeconds) {
  const id = ++timerIdCounter;
  const timer = { id, label, total: totalSeconds, remaining: totalSeconds, running: false, interval: null, done: false };
  timers.push(timer);
  renderTimers();
  startTimer(id);
  return id;
}

function startTimer(id) {
  const t = timers.find(x => x.id === id);
  if (!t || t.done) return;
  t.running = true;
  t.interval = setInterval(() => {
    t.remaining--;
    if (t.remaining <= 0) {
      t.remaining = 0;
      t.running = false;
      t.done = true;
      clearInterval(t.interval);
      t.interval = null;
      notifyTimerDone(t.label);
    }
    renderTimers();
  }, 1000);
  renderTimers();
}

function pauseTimer(id) {
  const t = timers.find(x => x.id === id);
  if (!t) return;
  t.running = false;
  clearInterval(t.interval);
  t.interval = null;
  renderTimers();
}

function resetTimer(id) {
  const t = timers.find(x => x.id === id);
  if (!t) return;
  clearInterval(t.interval);
  t.interval = null;
  t.remaining = t.total;
  t.running = false;
  t.done = false;
  renderTimers();
}

function removeTimer(id) {
  const t = timers.find(x => x.id === id);
  if (t) { clearInterval(t.interval); }
  timers = timers.filter(x => x.id !== id);
  renderTimers();
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function renderTimers() {
  const bar = document.getElementById('timerBar');
  const addBtn = bar.querySelector('.add-timer-btn');
  // Remove old chips
  bar.querySelectorAll('.timer-chip').forEach(el => el.remove());
  // Render each timer before the add button
  timers.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'timer-chip' + (t.running ? ' running' : '') + (t.done ? ' done' : '');
    chip.innerHTML = `
      <span class="timer-label">${esc(t.label)}</span>
      <span class="timer-display">${t.done ? '0:00' : formatTime(t.remaining)}</span>
      <span class="timer-actions">
        ${t.done
          ? `<button class="timer-btn" onclick="event.stopPropagation();resetTimer(${t.id})" title="Reset">↺</button>`
          : t.running
            ? `<button class="timer-btn" onclick="event.stopPropagation();pauseTimer(${t.id})" title="Pause">⏸</button>`
            : `<button class="timer-btn" onclick="event.stopPropagation();startTimer(${t.id})" title="Start">▶</button>`
        }
        <button class="timer-btn" onclick="event.stopPropagation();removeTimer(${t.id})" title="Remove">✕</button>
      </span>
    `;
    bar.insertBefore(chip, addBtn);
  });
}

function notifyTimerDone(label) {
  // Vibrate if available
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
  // Notification if permitted
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('Timer done!', { body: label + ' is ready', tag: 'timer-' + label });
  }
  // Audio beep using Web Audio
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 300, 600].forEach(delay => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.value = 0.3;
      osc.start(ctx.currentTime + delay / 1000);
      osc.stop(ctx.currentTime + delay / 1000 + 0.15);
    });
  } catch(e) {}
}

// Ask for notification permission on first interaction
document.addEventListener('click', function once() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  document.removeEventListener('click', once);
}, { once: true });

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TIMER MODAL
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openTimerModal(defaultLabel, defaultMin, defaultSec) {
  document.getElementById('timerLabelInput').value = defaultLabel || '';
  document.getElementById('timerMin').value = defaultMin || '';
  document.getElementById('timerSec').value = defaultSec || '';
  document.getElementById('timerModal').classList.add('open');
  document.getElementById('timerLabelInput').focus();
}

function closeTimerModal() {
  document.getElementById('timerModal').classList.remove('open');
}

function addTimerFromModal() {
  const label = document.getElementById('timerLabelInput').value.trim() || 'Timer';
  const min = parseInt(document.getElementById('timerMin').value) || 0;
  const sec = parseInt(document.getElementById('timerSec').value) || 0;
  const total = min * 60 + sec;
  if (total > 0) {
    createTimer(label, total);
  }
  closeTimerModal();
}

// Enter key in modal
document.getElementById('timerModal').addEventListener('keydown', e => {
  if (e.key === 'Enter') { addTimerFromModal(); }
  if (e.key === 'Escape') { closeTimerModal(); }
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// RENDER STEPS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderSteps() {
  const container = document.getElementById('stepsList');
  container.innerHTML = '';
  RECIPE.steps.forEach((step, i) => {
    const div = document.createElement('div');
    div.className = 'step';
    div.setAttribute('data-step', i);
    div.onclick = () => toggleStep(div);
    let timerTag = '';
    if (step.timer) {
      const dur = step.timer.min + (step.timer.sec > 0 ? ':' + String(step.timer.sec).padStart(2,'0') : '') + 'm';
      timerTag = `<span class="step-timer-tag" onclick="event.stopPropagation();openTimerModal('${esc(step.timer.label||("Step "+(i+1)))}',${step.timer.min},${step.timer.sec||0})">${dur} ⏱</span>`;
    }
    div.innerHTML = `
      <span class="step-num">${i + 1}</span>
      <span class="step-text">${esc(step.text)}${timerTag}</span>
    `;
    container.appendChild(div);
  });
}

function toggleStep(el) {
  el.classList.toggle('done-step');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// RENDER INGREDIENTS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderIngredients() {
  const container = document.getElementById('ingredientsList');
  container.innerHTML = '';
  RECIPE.ingredients.forEach(group => {
    const div = document.createElement('div');
    div.className = 'ingredient-group';
    div.innerHTML = `<h3>${esc(group.category)}</h3>`;
    group.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'ingredient';
      row.onclick = () => { row.classList.toggle('checked'); };
      row.innerHTML = `
        <span class="check-box">✓</span>
        <span class="ing-amount">${esc(item.amount)}</span>
        <span class="ing-name">${esc(item.name)}</span>
      `;
      div.appendChild(row);
    });
    container.appendChild(div);
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// RENDER NUTRITION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderNutrition() {
  const n = RECIPE.nutrition;
  if (!n || !n.calories) return;
  document.getElementById('nutritionBar').innerHTML = `
    <div class="nutr-item"><div class="nutr-val">${n.calories}</div><div class="nutr-label">kcal</div></div>
    <div class="nutr-item"><div class="nutr-val">${n.protein}g</div><div class="nutr-label">protein</div></div>
    <div class="nutr-item"><div class="nutr-val">${n.carbs}g</div><div class="nutr-label">carbs</div></div>
    <div class="nutr-item"><div class="nutr-val">${n.fat}g</div><div class="nutr-label">fat</div></div>
  `;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TAB SWITCHING (MOBILE)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let currentTab = 'steps';
let swipeContainer = null;

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (swipeContainer) {
    swipeContainer.classList.toggle('show-ingredients', tab === 'ingredients');
  } else {
    document.getElementById('panelSteps').classList.toggle('active', tab === 'steps');
    document.getElementById('panelIngredients').classList.toggle('active', tab === 'ingredients');
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SWIPE SUPPORT (MOBILE)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function setupSwipe() {
  if (window.innerWidth > 768) {
    // Undo swipe container if resized to desktop
    if (swipeContainer) {
      const main = document.getElementById('mainContent');
      main.innerHTML = '';
      main.appendChild(document.getElementById('panelSteps') || swipeContainer.children[0]);
      main.appendChild(document.getElementById('panelIngredients') || swipeContainer.children[0]);
      swipeContainer = null;
    }
    return;
  }
  if (swipeContainer) return;
  const main = document.getElementById('mainContent');
  const steps = document.getElementById('panelSteps');
  const ings = document.getElementById('panelIngredients');
  swipeContainer = document.createElement('div');
  swipeContainer.className = 'swipe-container';
  main.innerHTML = '';
  swipeContainer.appendChild(steps);
  swipeContainer.appendChild(ings);
  main.appendChild(swipeContainer);
  steps.classList.add('active');
  ings.classList.add('active');

  // Touch swipe
  let startX = 0;
  let startY = 0;
  swipeContainer.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  swipeContainer.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
      if (dx < 0) switchTab('ingredients');
      else switchTab('steps');
    }
  }, { passive: true });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// WAKE LOCK
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      document.getElementById('wakeLock').classList.add('active');
      wakeLock.addEventListener('release', () => document.getElementById('wakeLock').classList.remove('active'));
    }
  } catch(e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// UTILS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INIT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
renderSteps();
renderIngredients();
renderNutrition();
setupSwipe();
requestWakeLock();
window.addEventListener('resize', setupSwipe);
</script>
</body>
</html>
