<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ras el Hanout Chickpea & Spinach Stew — Cook Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
  /* ─────────────────────────────────────────────
     "Kitchen Pass" — warm-dark cook-mode design system
     ───────────────────────────────────────────── */
  :root {
    --font-display: "Newsreader", "Iowan Old Style", Palatino, Georgia, serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;

    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
    --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
    --r-card: 16px; --r-chip: 12px; --r-pill: 999px; --r-check: 7px;
    --ease: cubic-bezier(.4, 0, .2, 1); --t-ui: 160ms; --t-panel: 240ms;

    --accent: #F2853B;
    --accent-strong: #FF9A52;
    --accent-soft: rgba(242, 133, 59, 0.14);
    --accent-glow: rgba(242, 133, 59, 0.34);

    --bg: #14110D;
    --surface-1: #1C1813;
    --surface-2: #252019;
    --surface-3: #312A20;
    --border: #3A3327;
    --border-soft: #2A2419;
    --text: #F4ECE0;
    --text-muted: #ADA08C;
    --text-faint: #786E5E;
    --success: #8FBE76;
    --success-soft: rgba(143, 190, 118, 0.16);
    --scrim: rgba(0, 0, 0, 0.66);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-ui);
    background: var(--bg); color: var(--text);
    min-height: 100dvh; overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); }
  .icon { width: 1em; height: 1em; stroke: currentColor; stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; display: block; }

  /* ── Header ── */
  .ck-header {
    background: color-mix(in srgb, var(--surface-1) 92%, transparent);
    backdrop-filter: saturate(140%) blur(12px); -webkit-backdrop-filter: saturate(140%) blur(12px);
    border-bottom: 1px solid var(--border-soft); padding: var(--sp-4) var(--sp-6);
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4);
  }
  .ck-title {
    font-family: var(--font-display); font-weight: 500;
    font-size: clamp(1.5rem, 4.4vw, 2rem); line-height: 1.08; letter-spacing: -0.01em;
    color: var(--text); text-wrap: pretty;
  }
  .ck-meta { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); flex-wrap: wrap; }
  .ck-meta .pill {
    font-size: 0.72rem; font-weight: 600; color: var(--text-muted);
    background: var(--surface-2); border: 1px solid var(--border-soft);
    padding: 4px 10px; border-radius: var(--r-pill);
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .ck-meta .pill .icon { width: 0.85em; height: 0.85em; color: var(--text-faint); }
  .ck-meta .pill b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 700; }
  .wake-dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--border); flex-shrink: 0;
    align-self: center; transition: background var(--t-ui), box-shadow var(--t-ui);
  }
  .wake-dot.active { background: var(--success); box-shadow: 0 0 0 4px var(--success-soft); }

  /* ── Timer bar ── */
  .timer-bar {
    background: var(--surface-1); border-bottom: 1px solid var(--border-soft);
    padding: var(--sp-3) var(--sp-6); display: flex; gap: var(--sp-3); align-items: center;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    position: sticky; top: 0; z-index: 99;
  }
  .timer-bar::-webkit-scrollbar { display: none; }
  .timer-chip {
    flex-shrink: 0; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-chip); padding: 8px 8px 8px 14px;
    display: flex; align-items: center; gap: var(--sp-3); cursor: pointer;
    user-select: none; -webkit-user-select: none;
    transition: border-color var(--t-ui), background var(--t-ui), box-shadow var(--t-ui);
  }
  .timer-chip:hover { border-color: var(--text-faint); }
  .timer-chip.running { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 22px -10px var(--accent-glow); }
  .timer-chip.done { border-color: var(--accent-strong); background: var(--accent-soft); animation: pulse 1.1s var(--ease) infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.62; } }
  .timer-chip .t-label { font-size: 0.72rem; color: var(--text-muted); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timer-chip .t-time {
    font-family: var(--font-mono); font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums;
    color: var(--text); min-width: 60px; text-align: center; letter-spacing: -0.02em;
  }
  .timer-chip.running .t-time, .timer-chip.done .t-time { color: var(--accent-strong); }
  .timer-chip .t-actions { display: flex; gap: 4px; }
  .t-btn {
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: var(--surface-3); color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
    transition: background var(--t-ui), color var(--t-ui), transform var(--t-ui);
  }
  .t-btn:hover { background: var(--border); color: var(--text); }
  .t-btn:active { transform: scale(0.9); }
  .add-timer {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%;
    border: 1.5px dashed var(--border); background: transparent; color: var(--text-faint); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color var(--t-ui), color var(--t-ui), transform var(--t-ui);
  }
  .add-timer .icon { width: 18px; height: 18px; }
  .add-timer:hover { border-color: var(--accent); color: var(--accent); }
  .add-timer:active { transform: scale(0.92); }

  /* ── Main split ── */
  .main { display: flex; height: calc(100dvh - var(--shell-offset, 150px)); }
  .panel { flex: 1; overflow-y: auto; padding: var(--sp-6); -webkit-overflow-scrolling: touch; }
  .panel-steps { border-right: 1px solid var(--border-soft); }
  .panel-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: var(--sp-5); padding-bottom: var(--sp-3); border-bottom: 1px solid var(--border-soft);
  }
  .panel-head h2 { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em; color: var(--text-faint); }
  .panel-head .count { font-size: 0.72rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  /* ── Steps ── */
  .step {
    display: flex; gap: var(--sp-4); margin-bottom: var(--sp-3); padding: var(--sp-4);
    border-radius: var(--r-card); background: var(--surface-1); border: 1px solid var(--border-soft); cursor: pointer;
    transition: opacity var(--t-panel), border-color var(--t-ui), background var(--t-ui), transform var(--t-ui);
  }
  .step:hover { border-color: var(--border); }
  .step:active { transform: scale(0.992); }
  .step.current { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 60%, var(--surface-1)); box-shadow: 0 8px 30px -16px var(--accent-glow); }
  .step.done-step { opacity: 0.42; }
  .step-num {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--surface-3); color: var(--text-muted);
    font-family: var(--font-display); font-size: 1.05rem; font-weight: 500;
    display: flex; align-items: center; justify-content: center; transition: background var(--t-ui), color var(--t-ui);
  }
  .step.current .step-num { background: var(--accent); color: #1b1206; font-weight: 600; }
  .step.done-step .step-num { background: var(--success-soft); color: var(--success); }
  .step.done-step .step-num .num { display: none; }
  .step-num .check { display: none; width: 18px; height: 18px; }
  .step.done-step .step-num .check { display: block; }
  .step-text { font-size: 1rem; line-height: 1.62; color: var(--text); flex: 1; text-wrap: pretty; }
  .step.done-step .step-text { text-decoration: line-through; text-decoration-color: var(--text-faint); }
  .step-timer-tag {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--accent-soft); color: var(--accent-strong);
    font-size: 0.74rem; font-weight: 600; font-family: var(--font-mono);
    padding: 3px 9px; border-radius: var(--r-pill); margin-left: 7px;
    cursor: pointer; vertical-align: middle; white-space: nowrap; transition: background var(--t-ui);
  }
  .step-timer-tag .icon { width: 13px; height: 13px; }
  .step-timer-tag:hover { background: color-mix(in srgb, var(--accent-soft) 60%, var(--accent)); }

  /* ── Ingredients (prep-stage groups, falls back to category) ── */
  .stage { margin-bottom: var(--sp-6); }
  .stage-head { display: flex; align-items: baseline; gap: var(--sp-3); margin-bottom: var(--sp-3); }
  .stage-head .stage-name { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 1.18rem; color: var(--text); }
  .stage-head .stage-rule { flex: 1; height: 1px; background: var(--border-soft); }
  .stage-head .stage-count { font-size: 0.7rem; font-weight: 600; color: var(--text-faint); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  .stage-hint { font-size: 0.72rem; color: var(--text-faint); margin: -2px 0 var(--sp-3) 2px; }
  .ingredient {
    display: flex; align-items: center; gap: var(--sp-3); padding: 11px var(--sp-3); border-radius: 10px; margin-bottom: 2px;
    cursor: pointer; user-select: none; -webkit-user-select: none; transition: background var(--t-ui), opacity var(--t-panel);
  }
  .ingredient:hover { background: var(--surface-1); }
  .ingredient.checked { opacity: 0.4; }
  .ingredient.checked .ing-name { text-decoration: line-through; }
  .check-box {
    width: 22px; height: 22px; border-radius: var(--r-check); flex-shrink: 0; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center; color: transparent; transition: all var(--t-ui);
  }
  .check-box .icon { width: 13px; height: 13px; }
  .ingredient.checked .check-box { background: var(--success); border-color: var(--success); color: var(--bg); }
  .ing-amount { font-family: var(--font-mono); font-weight: 600; font-size: 0.95rem; color: var(--text); min-width: 72px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .ing-name { color: var(--text-muted); font-size: 1rem; text-wrap: pretty; }

  /* ── Nutrition ── */
  .nutrition {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border-soft);
    border: 1px solid var(--border-soft); border-radius: var(--r-card); overflow: hidden; margin-top: var(--sp-6);
  }
  .nutr-item { background: var(--surface-1); padding: var(--sp-4) var(--sp-2); text-align: center; }
  .nutr-item.hero { background: color-mix(in srgb, var(--accent-soft) 50%, var(--surface-1)); }
  .nutr-val { font-family: var(--font-display); font-size: 1.5rem; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
  .nutr-item.hero .nutr-val { color: var(--accent-strong); }
  .nutr-label { font-size: 0.62rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 3px; font-weight: 600; }

  /* ── Tab bar (mobile) ── */
  .tab-bar {
    display: none; position: fixed; bottom: 0; left: 0; right: 0;
    background: color-mix(in srgb, var(--surface-1) 94%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border-soft); z-index: 100; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0));
  }
  .tab-inner { display: flex; gap: 4px; background: var(--surface-2); border-radius: var(--r-chip); padding: 4px; }
  .tab-btn {
    flex: 1; padding: 11px; text-align: center; font-size: 0.8rem; font-weight: 600; color: var(--text-muted);
    background: transparent; border: none; cursor: pointer; border-radius: 9px; transition: background var(--t-ui), color var(--t-ui);
  }
  .tab-btn.active { color: var(--text); background: var(--surface-3); box-shadow: 0 1px 4px rgba(0,0,0,.18); }

  /* ── Timer modal ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: var(--scrim); z-index: 200;
    align-items: center; justify-content: center; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); padding: var(--sp-5);
  }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface-1); border: 1px solid var(--border); border-radius: 20px; padding: var(--sp-8); width: min(380px, 100%); }
  .modal h3 { font-family: var(--font-display); font-size: 1.4rem; font-weight: 500; margin-bottom: var(--sp-5); }
  .modal label { font-size: 0.74rem; color: var(--text-muted); font-weight: 600; display: block; margin: var(--sp-4) 0 var(--sp-2); }
  .modal input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    color: var(--text); font-size: 1rem; font-family: var(--font-ui); outline: none; transition: border-color var(--t-ui);
  }
  .modal input:focus { border-color: var(--accent); }
  .time-inputs { display: flex; gap: var(--sp-3); }
  .time-inputs input { text-align: center; font-family: var(--font-mono); font-size: 1.1rem; }
  .modal-actions { display: flex; gap: var(--sp-3); margin-top: var(--sp-6); }
  .modal-actions button { flex: 1; padding: 13px; border-radius: 12px; border: none; font-size: 0.95rem; font-weight: 700; font-family: var(--font-ui); cursor: pointer; transition: background var(--t-ui), transform var(--t-ui); }
  .modal-actions button:active { transform: scale(0.98); }
  .btn-cancel { background: var(--surface-3); color: var(--text-muted); }
  .btn-cancel:hover { background: var(--border); }
  .btn-start { background: var(--accent); color: #1b1206; }
  .btn-start:hover { background: var(--accent-strong); }

  /* ── Mobile ── */
  @media (max-width: 768px) {
    .ck-header { padding: var(--sp-4); }
    .timer-bar { padding: var(--sp-3) var(--sp-4); }
    .main { display: block; height: auto; min-height: 100dvh; padding-bottom: 80px; }
    .panel { padding: var(--sp-5) var(--sp-4); display: none; }
    .panel.active { display: block; }
    .panel-steps { border-right: none; }
    .tab-bar { display: block; }
  }
  @media (min-width: 769px) { .panel { display: block !important; } .tab-bar { display: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
</style>
</head>
<body>

<header class="ck-header">
  <div>
    <h1 class="ck-title">Ras el Hanout Chickpea & Spinach Stew</h1>
    <div class="ck-meta">
      <span class="pill"><svg class="icon" viewBox="0 0 24 24"><path d="M5 21V8a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v13"/><path d="M3 21h18"/><path d="M9 8h6"/></svg><b>4</b> servings</span>
      <span class="pill"><svg class="icon" viewBox="0 0 24 24"><path d="M14 4h-4M12 4v4"/><circle cx="12" cy="14" r="7"/></svg><b>5</b>m prep</span>
      <span class="pill"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2c1 3-2 4-2 6a2 2 0 0 0 4 0c0-1 1-2 1-2 2 2 3 4 3 7a6 6 0 0 1-12 0c0-3 3-6 6-11Z"/></svg><b>25</b>m cook</span>
    </div>
  </div>
  <div class="wake-dot" id="wakeDot" title="Screen stays on while cooking"></div>
</header>

<div class="timer-bar" id="timerBar">
  <button class="add-timer" onclick="openTimerModal()" title="Add timer"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div class="main" id="mainContent">
  <section class="panel panel-steps active" id="panelSteps">
    <div class="panel-head"><h2>Instructions</h2><span class="count" id="stepCount"></span></div>
    <div id="stepsList"></div>
  </section>
  <section class="panel panel-ingredients" id="panelIngredients">
    <div class="panel-head"><h2>Ingredients</h2><span class="count" id="ingCount"></span></div>
    <div id="ingredientsList"></div>
    <div class="nutrition" id="nutritionBar"></div>
  </section>
</div>

<nav class="tab-bar">
  <div class="tab-inner">
    <button class="tab-btn active" data-tab="steps" onclick="switchTab('steps')">Instructions</button>
    <button class="tab-btn" data-tab="ingredients" onclick="switchTab('ingredients')">Ingredients</button>
  </div>
</nav>

<div class="modal-overlay" id="timerModal">
  <div class="modal">
    <h3>Add a timer</h3>
    <label>Label</label>
    <input type="text" id="timerLabelInput" placeholder="e.g. Simmer sauce" autocomplete="off">
    <label>Duration</label>
    <div class="time-inputs">
      <input type="number" id="timerMin" placeholder="min" min="0" max="999" inputmode="numeric">
      <input type="number" id="timerSec" placeholder="sec" min="0" max="59" inputmode="numeric">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeTimerModal()">Cancel</button>
      <button class="btn-start" onclick="addTimerFromModal()">Start</button>
    </div>
  </div>
</div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// RECIPE DATA — this whole object is replaced per recipe by the plan-meal skill.

const ICON = {
  play: '<svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg class="icon" viewBox="0 0 24 24"><path d="M7 5v14M17 5v14"/></svg>',
  reset: '<svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  close: '<svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>',
  timer: '<svg class="icon" viewBox="0 0 24 24"><path d="M14 3h-4M12 3v4"/><circle cx="12" cy="13" r="8"/></svg>'
};

// ── Timers ──
let timers = [], timerId = 0;
function createTimer(label, total) { const id = ++timerId; timers.push({ id, label, total, remaining: total, running: false, interval: null, done: false }); renderTimers(); startTimer(id); }
function startTimer(id) { const t = timers.find(x => x.id === id); if (!t || t.done) return; t.running = true; t.interval = setInterval(() => { t.remaining--; if (t.remaining <= 0) { t.remaining = 0; t.running = false; t.done = true; clearInterval(t.interval); notifyDone(t.label); } renderTimers(); }, 1000); renderTimers(); }
function pauseTimer(id) { const t = timers.find(x => x.id === id); if (!t) return; t.running = false; clearInterval(t.interval); renderTimers(); }
function resetTimer(id) { const t = timers.find(x => x.id === id); if (!t) return; clearInterval(t.interval); t.remaining = t.total; t.running = false; t.done = false; renderTimers(); }
function removeTimer(id) { const t = timers.find(x => x.id === id); if (t) clearInterval(t.interval); timers = timers.filter(x => x.id !== id); renderTimers(); }
function fmt(s) { return Math.floor(s / 60) + ':' + (s % 60).toString().padStart(2, '0'); }
function renderTimers() {
  const bar = document.getElementById('timerBar'), add = bar.querySelector('.add-timer');
  bar.querySelectorAll('.timer-chip').forEach(e => e.remove());
  timers.forEach(t => {
    const c = document.createElement('div');
    c.className = 'timer-chip' + (t.running ? ' running' : '') + (t.done ? ' done' : '');
    const ctrl = t.done ? `<button class="t-btn" onclick="event.stopPropagation();resetTimer(${t.id})">${ICON.reset}</button>`
      : t.running ? `<button class="t-btn" onclick="event.stopPropagation();pauseTimer(${t.id})">${ICON.pause}</button>`
      : `<button class="t-btn" onclick="event.stopPropagation();startTimer(${t.id})">${ICON.play}</button>`;
    c.innerHTML = `<span class="t-label">${esc(t.label)}</span><span class="t-time">${fmt(t.remaining)}</span><span class="t-actions">${ctrl}<button class="t-btn" onclick="event.stopPropagation();removeTimer(${t.id})">${ICON.close}</button></span>`;
    bar.insertBefore(c, add);
  });
}
function notifyDone(label) {
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
  if ('Notification' in window && Notification.permission === 'granted') new Notification('Timer done', { body: label + ' is ready' });
  try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); [0, 300, 600].forEach(d => { const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.value = 0.3; o.start(ctx.currentTime + d / 1000); o.stop(ctx.currentTime + d / 1000 + 0.15); }); } catch (e) {}
}
document.addEventListener('click', function once() { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); document.removeEventListener('click', once); }, { once: true });

// ── Timer modal ──
function openTimerModal(l, m, s) { document.getElementById('timerLabelInput').value = l || ''; document.getElementById('timerMin').value = m || ''; document.getElementById('timerSec').value = s || ''; document.getElementById('timerModal').classList.add('open'); document.getElementById('timerLabelInput').focus(); }
function closeTimerModal() { document.getElementById('timerModal').classList.remove('open'); }
function addTimerFromModal() { const l = document.getElementById('timerLabelInput').value.trim() || 'Timer'; const m = parseInt(document.getElementById('timerMin').value) || 0; const s = parseInt(document.getElementById('timerSec').value) || 0; if (m * 60 + s > 0) createTimer(l, m * 60 + s); closeTimerModal(); }
document.getElementById('timerModal').addEventListener('keydown', e => { if (e.key === 'Enter') addTimerFromModal(); if (e.key === 'Escape') closeTimerModal(); });
document.getElementById('timerModal').addEventListener('click', e => { if (e.target.id === 'timerModal') closeTimerModal(); });

// ── Steps (the ember "current" marker tracks the first step not yet done) ──
function renderSteps() {
  const c = document.getElementById('stepsList'); c.innerHTML = '';
  RECIPE.steps.forEach((step, i) => {
    const d = document.createElement('div'); d.className = 'step';
    d.onclick = () => { d.classList.toggle('done-step'); updateCurrent(); };
    let tag = '';
    if (step.timer) {
      const dur = step.timer.min + (step.timer.sec ? ':' + String(step.timer.sec).padStart(2, '0') : '') + 'm';
      tag = `<span class="step-timer-tag" onclick="event.stopPropagation();openTimerModal('${esc(step.timer.label || ('Step ' + (i + 1)))}',${step.timer.min},${step.timer.sec || 0})">${ICON.timer}${dur}</span>`;
    }
    d.innerHTML = `<span class="step-num"><span class="num">${i + 1}</span>${ICON.check.replace('class="icon"', 'class="icon check"')}</span><span class="step-text">${esc(step.text)}${tag}</span>`;
    c.appendChild(d);
  });
  document.getElementById('stepCount').textContent = RECIPE.steps.length + ' steps';
  updateCurrent();
}
function updateCurrent() {
  const steps = [...document.querySelectorAll('#stepsList .step')];
  steps.forEach(s => s.classList.remove('current'));
  const next = steps.find(s => !s.classList.contains('done-step'));
  if (next) next.classList.add('current');
}

// ── Ingredients (prep-stage groups; falls back to `category`) ──
function renderIngredients() {
  const c = document.getElementById('ingredientsList'); c.innerHTML = ''; let total = 0;
  RECIPE.ingredients.forEach(group => {
    const label = group.stage || group.category || 'Ingredients';
    const g = document.createElement('div'); g.className = 'stage';
    let rows = '';
    group.items.forEach(it => { total++; rows += `<div class="ingredient" onclick="this.classList.toggle('checked')"><span class="check-box">${ICON.check}</span><span class="ing-amount">${esc(it.amount)}</span><span class="ing-name">${esc(it.name)}</span></div>`; });
    g.innerHTML = `<div class="stage-head"><span class="stage-name">${esc(label)}</span><span class="stage-rule"></span><span class="stage-count">${group.items.length}</span></div>${group.hint ? `<div class="stage-hint">${esc(group.hint)}</div>` : ''}${rows}`;
    c.appendChild(g);
  });
  document.getElementById('ingCount').textContent = total + ' items';
}

// ── Nutrition ──
function renderNutrition() {
  const n = RECIPE.nutrition; if (!n || !n.calories) { document.getElementById('nutritionBar').style.display = 'none'; return; }
  const cells = [
    { v: n.calories, l: 'kcal' },
    { v: n.protein + 'g', l: 'protein', hero: true },
    { v: n.carbs + 'g', l: 'carbs' },
    { v: n.fat + 'g', l: 'fat' }
  ];
  if (n.satfat != null) cells.push({ v: n.satfat + 'g', l: 'sat fat' });
  if (n.salt != null) cells.push({ v: n.salt + 'g', l: 'salt' });
  const bar = document.getElementById('nutritionBar');
  bar.style.gridTemplateColumns = `repeat(${cells.length % 3 === 0 ? 3 : 4}, 1fr)`;
  bar.innerHTML = cells.map(c => `<div class="nutr-item${c.hero ? ' hero' : ''}"><div class="nutr-val">${c.v}</div><div class="nutr-label">${c.l}</div></div>`).join('');
}

// ── Tabs + swipe (mobile) ──
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('panelSteps').classList.toggle('active', tab === 'steps');
  document.getElementById('panelIngredients').classList.toggle('active', tab === 'ingredients');
}
(function () {
  let x0 = 0, y0 = 0; const main = document.getElementById('mainContent');
  main.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  main.addEventListener('touchend', e => {
    if (window.innerWidth > 768) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) switchTab(dx < 0 ? 'ingredients' : 'steps');
  }, { passive: true });
})();

// ── Keep the split panels filling the viewport below the sticky header + timer bar ──
function setShellOffset() {
  const h = document.querySelector('.ck-header').offsetHeight + document.getElementById('timerBar').offsetHeight;
  document.documentElement.style.setProperty('--shell-offset', h + 'px');
}

// ── Wake lock (green dot when the screen is held awake) ──
let wakeLock = null;
async function requestWakeLock() {
  try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); document.getElementById('wakeDot').classList.add('active'); wakeLock.addEventListener('release', () => document.getElementById('wakeDot').classList.remove('active')); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestWakeLock(); });

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// ── Init ──
renderSteps(); renderIngredients(); renderNutrition(); setShellOffset(); requestWakeLock();
window.addEventListener('resize', setShellOffset);
</script>
</body>
