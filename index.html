<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Meal Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
  /* ── "Kitchen Pass" — shared warm-dark system (mirrors templates/cooking.html) ── */
  :root {
    --font-display: "Newsreader", "Iowan Old Style", Palatino, Georgia, serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;
    --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
    --r-card: 16px; --r-pill: 999px; --ease: cubic-bezier(.4, 0, .2, 1); --t-ui: 160ms;
    --accent: #F2853B; --accent-strong: #FF9A52; --accent-soft: rgba(242, 133, 59, 0.14); --accent-glow: rgba(242, 133, 59, 0.34);
    --bg: #14110D; --surface-1: #1C1813; --surface-2: #252019; --surface-3: #312A20;
    --border: #3A3327; --border-soft: #2A2419;
    --text: #F4ECE0; --text-muted: #ADA08C; --text-faint: #786E5E;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; }
  body { font-family: var(--font-ui); background: var(--bg); color: var(--text); min-height: 100dvh; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent-soft); }
  .icon { width: 1em; height: 1em; stroke: currentColor; stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; display: block; }

  .wrap { max-width: 720px; margin: 0 auto; padding: var(--sp-6) var(--sp-5) 80px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-4); margin-bottom: var(--sp-8); }
  .wordmark { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
  .wordmark .dot { color: var(--accent); }
  .date { font-size: 0.8rem; color: var(--text-faint); font-weight: 500; text-align: right; }

  /* ── Hero ── */
  .hero {
    background: var(--surface-1); border: 1px solid var(--border-soft); border-radius: 22px;
    padding: var(--sp-8) var(--sp-6) var(--sp-6); position: relative; overflow: hidden; margin-bottom: var(--sp-8);
  }
  .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 80% at 90% -10%, var(--accent-soft), transparent 60%); }
  .hero-label {
    display: inline-flex; align-items: center; gap: 7px; font-size: 0.7rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); margin-bottom: var(--sp-3);
  }
  .hero-label .blip { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .hero-name { font-family: var(--font-display); font-size: clamp(2rem, 7vw, 2.9rem); font-weight: 500; line-height: 1.05; letter-spacing: -0.015em; text-wrap: pretty; }
  .hero-btn {
    display: inline-flex; align-items: center; gap: 9px; margin-top: var(--sp-6);
    background: var(--accent); color: #1b1206; font-size: 1rem; font-weight: 700;
    text-decoration: none; border-radius: var(--r-pill); padding: 14px 24px; cursor: pointer;
    transition: transform var(--t-ui), background var(--t-ui); box-shadow: 0 10px 30px -12px var(--accent-glow);
  }
  .hero-btn .icon { width: 18px; height: 18px; stroke-width: 2.3; }
  .hero-btn:hover { background: var(--accent-strong); transform: translateY(-1px); }
  .hero-btn:active { transform: translateY(0) scale(0.99); }
  .no-meal { color: var(--text-faint); font-size: 1rem; padding: var(--sp-4) 0; }

  /* ── Schedule ── */
  .day-group { margin-bottom: var(--sp-6); }
  .day-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-faint); margin-bottom: var(--sp-3); padding-left: 2px; }
  .meal-row {
    display: flex; align-items: center; gap: var(--sp-4); background: var(--surface-1); border: 1px solid var(--border-soft);
    border-radius: var(--r-card); padding: var(--sp-4) var(--sp-5); margin-bottom: var(--sp-2);
    text-decoration: none; color: inherit; transition: border-color var(--t-ui), transform var(--t-ui), background var(--t-ui);
  }
  .meal-row:hover { border-color: var(--border); }
  .meal-row:active { transform: scale(0.995); }
  .meal-row.past { opacity: 0.5; }
  .meal-row.now { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface-1)); }
  .meal-when { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; min-width: 64px; }
  .meal-row.now .meal-when { color: var(--accent); }
  .meal-info { flex: 1; min-width: 0; }
  .meal-name-sm { font-family: var(--font-display); font-size: 1.15rem; font-weight: 500; line-height: 1.2; }
  .chev { color: var(--text-faint); flex-shrink: 0; width: 18px; height: 18px; }

  /* ── Empty state ── */
  .empty-state { text-align: center; padding: 64px 20px; color: var(--text-faint); }
  .empty-state .icon { width: 40px; height: 40px; margin: 0 auto var(--sp-4); stroke-width: 1.4; }
  .empty-state p { font-size: 0.95rem; line-height: 1.6; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.001ms !important; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="wordmark">Meal Plan<span class="dot">.</span></div>
    <div class="date" id="headerDate"></div>
  </div>
  <div id="hero"></div>
  <div id="schedule"></div>
</div>

<script>
// ── Config ──
const MEAL_WINDOWS = {
  breakfast: { start: 5, end: 11 },   // 5am – 10:59am
  lunch:     { start: 11, end: 15 },   // 11am – 2:59pm
  dinner:    { start: 15, end: 23 }    // 3pm – 10:59pm
};
const MEAL_ORDER = ["breakfast", "lunch", "dinner"];

const ICON_PLAY = '<svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_CHEV = '<svg class="icon chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';

// ── Load manifest ──
async function loadMeals() {
  try {
    const resp = await fetch('meals.json?_=' + Date.now());
    if (!resp.ok) throw new Error('No meals.json found');
    return await resp.json();
  } catch (e) {
    return [];
  }
}

// ── Time logic ──
function getCurrentMealType(now) {
  const hour = now.getHours();
  for (const [type, window] of Object.entries(MEAL_WINDOWS)) {
    if (hour >= window.start && hour < window.end) return type;
  }
  return null;
}
function getDateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function formatDayLabel(dateStr, today) {
  if (dateStr === today) return "Today";
  const d = new Date(dateStr + 'T12:00:00');
  const tomorrow = new Date(today + 'T12:00:00');
  tomorrow.setDate(tomorrow.getDate() + 1);
  if (dateStr === getDateStr(tomorrow)) return "Tomorrow";
  return d.toLocaleDateString('en-IE', { weekday: 'long', day: 'numeric', month: 'short' });
}
function isPast(dateStr, mealType, todayStr, currentMealType) {
  if (dateStr < todayStr) return true;
  if (dateStr > todayStr) return false;
  const mealIdx = MEAL_ORDER.indexOf(mealType);
  const currentIdx = MEAL_ORDER.indexOf(currentMealType);
  if (currentIdx === -1) return false;
  return mealIdx < currentIdx;
}

// ── Render ──
async function render() {
  const meals = await loadMeals();
  const now = new Date();
  const todayStr = getDateStr(now);
  const currentMealType = getCurrentMealType(now);

  document.getElementById('headerDate').textContent =
    now.toLocaleDateString('en-IE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  if (meals.length === 0) {
    document.getElementById('hero').innerHTML = `
      <div class="empty-state">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 11h18M5 11a7 7 0 0 1 14 0M12 3v1M4 21h16"/></svg>
        <p>No meals planned yet.<br>Ask Claude to plan your meals.</p>
      </div>`;
    document.getElementById('schedule').innerHTML = '';
    return;
  }

  // Hero: current meal, else next upcoming
  const currentMeal = meals.find(m => m.date === todayStr && m.meal === currentMealType);
  const hero = document.getElementById('hero');
  let heroMeal = currentMeal, heroLabel = '';
  if (currentMeal) {
    heroLabel = 'Now · ' + currentMeal.meal;
  } else {
    const upcoming = meals.find(m => {
      if (m.date > todayStr) return true;
      if (m.date === todayStr) return MEAL_ORDER.indexOf(m.meal) >= MEAL_ORDER.indexOf(currentMealType || 'breakfast');
      return false;
    });
    if (upcoming) {
      heroMeal = upcoming;
      heroLabel = upcoming.date === todayStr ? 'Up next · ' + upcoming.meal : formatDayLabel(upcoming.date, todayStr) + ' · ' + upcoming.meal;
    }
  }
  if (heroMeal) {
    hero.innerHTML = `
      <div class="hero">
        <div class="hero-label"><span class="blip"></span> ${esc(heroLabel)}</div>
        <div class="hero-name">${esc(heroMeal.name)}</div>
        <a href="${heroMeal.file}" class="hero-btn">${ICON_PLAY} Open cook mode</a>
      </div>`;
  } else {
    hero.innerHTML = `<div class="hero"><div class="no-meal">No more meals planned.</div></div>`;
  }

  // Schedule grouped by day
  const grouped = {};
  meals.forEach(m => { (grouped[m.date] = grouped[m.date] || []).push(m); });
  let html = '';
  Object.keys(grouped).sort().forEach(date => {
    const dayMeals = grouped[date].sort((a, b) => MEAL_ORDER.indexOf(a.meal) - MEAL_ORDER.indexOf(b.meal));
    html += `<div class="day-group"><div class="day-label">${esc(formatDayLabel(date, todayStr))}</div>`;
    dayMeals.forEach(m => {
      const isCurrent = (m.date === todayStr && m.meal === currentMealType);
      const past = isPast(m.date, m.meal, todayStr, currentMealType);
      const cls = isCurrent ? 'now' : past ? 'past' : '';
      html += `
        <a href="${m.file}" class="meal-row ${cls}">
          <span class="meal-when">${esc(m.meal)}</span>
          <div class="meal-info"><div class="meal-name-sm">${esc(m.name)}</div></div>
          ${ICON_CHEV}
        </a>`;
    });
    html += `</div>`;
  });
  document.getElementById('schedule').innerHTML = html;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

render();
</script>
</body>
</html>
